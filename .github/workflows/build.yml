name: Build F4 Studio

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      request_signing:
        description: 'Submit the Windows artifact to SignPath for manual approval'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows application
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package unsigned Windows installer
        working-directory: desktop
        run: npm run dist -- --win nsis --publish never

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: f4-studio-windows-unsigned
          path: desktop/dist/F4-Studio-*-x64.exe
          if-no-files-found: error

  sign-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_signing == true }}
    needs: build-windows
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit artifact to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: f4-studio-windows-signed
          path: signed
          if-no-files-found: error
